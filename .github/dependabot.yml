version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'

  - package-ecosystem: 'npm'
    directory: '/packages/extension/tests/e2e'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'test'

  - package-ecosystem: 'npm'
    directory: '/packages/desktop/tests/integration'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'test'
      - 'desktop-windows'

  - package-ecosystem: 'cargo'
    directory: '/packages/desktop/src-tauri'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'desktop-windows'

  # The Win32 bindings generator: a crate of its own with its own lockfile. A
  # windows-bindgen bump is a regeneration — the lint job's drift gate reds the
  # bot's PR until the bindings are regenerated onto it.
  - package-ecosystem: 'cargo'
    directory: '/packages/desktop/src-tauri/tools/bindgen'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'desktop-windows'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
