version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'

  - package-ecosystem: 'npm'
    directory: '/packages/extension/tests/e2e'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'test'

  - package-ecosystem: 'npm'
    directory: '/packages/desktop/tests/integration'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'test'
      - 'desktop-windows'

  - package-ecosystem: 'cargo'
    directory: '/packages/desktop/src-tauri'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'desktop-windows'

  # The Win32 bindings generator: a crate of its own with its own lockfile. The
  # lint job's Win32 bindings freshness gate holds this pin and the desktop
  # crate's windows-core pin (the entry above) on one 0.<minor> version line and
  # the committed bindings equal to a fresh run, so a bot PR from either entry
  # stays red on its own: a minor-line bump lands as one change that moves both
  # pins and regenerates the bindings; a patch bump of windows-bindgen alone
  # needs only the regeneration pushed onto the bot's branch.
  - package-ecosystem: 'cargo'
    directory: '/packages/desktop/src-tauri/tools/bindgen'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'desktop-windows'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
