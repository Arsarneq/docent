version: 2
# Each entry groups its minor and patch version updates into one pull request
# per directory. Security updates are not grouped (applies-to: version-updates),
# so each advisory still opens its own pull request as soon as a fix is
# published, and a major version update arrives on its own pull request.
# Dependabot reads a 0.x version as major.minor.patch, so a 0.x line change counts
# as minor and joins its group; the windows-core and windows-bindgen pins are
# excluded from their groups so a line bump of either keeps its own pull request
# (the freshness gate below holds it red until both pins move together).
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      npm-root:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/packages/extension/tests/e2e'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'test'
    groups:
      npm-e2e:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/packages/desktop/tests/integration'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'test'
      - 'desktop-windows'
    groups:
      npm-integration:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'cargo'
    directory: '/packages/desktop/src-tauri'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'desktop-windows'
    groups:
      cargo-src-tauri:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - 'windows-core'
        update-types:
          - 'minor'
          - 'patch'

  # The Win32 bindings generator: a crate of its own with its own lockfile. The
  # lint job's Win32 bindings freshness gate holds this pin and the desktop
  # crate's windows-core pin (the entry above) on one 0.<minor> version line and
  # the committed bindings equal to a fresh run, so a bot PR that moves either
  # pin off the shared line, or changes the generator's output, stays red: a
  # minor-line bump lands as one change that moves both pins and regenerates
  # the bindings; a windows-bindgen bump whose output differs needs the
  # regeneration pushed onto the bot's branch; a bump that changes neither
  # passes as it is.
  - package-ecosystem: 'cargo'
    directory: '/packages/desktop/src-tauri/tools/bindgen'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'desktop-windows'
    groups:
      cargo-bindgen:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - 'windows-bindgen'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
    groups:
      actions-root:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
