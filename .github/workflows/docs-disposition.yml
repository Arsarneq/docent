# Checks the FORM of the two structured PR-body sections — "## Docs disposition"
# (one line per doc governing the changed code, per scripts/area-map.json, plus
# one per judgment-verified clause per docs/clause-registry.json) and
# "## Change record". Form only: it verifies the expected lines exist and parse;
# the judgments written in them are read by reviewers, never by this check.
# Re-runs when the PR body is edited. The classes that skip the sections, each
# with the inputs deciding it: dependency-only PRs (manifests, lockfiles,
# action-pin bumps), decided from the diff alone; and the release pipeline's own
# regeneration PR, decided from the diff plus the head branch the check derives
# from the event inputs supplied below — a branch on this repository, and
# nothing for a pull request opened from anywhere else. A diff whose changed
# files are the area map, alone or together with the clause registry, records
# one governance-data-only line in place of the per-doc lines. The classes and
# the grammar:
# .github/CONTRIBUTING.md ("Docs Disposition and Change Record").
name: Docs disposition format

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  disposition-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the check can diff against the PR base via
          # merge-base (three-dot).
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The check runs on the packages this job installs, so what it imports is
      # there however its import closure grows.
      - name: Install dependencies
        run: npm ci

      - name: Check the PR body sections are well-formed
        env:
          # Passed via env (never interpolated into the shell) so a crafted
          # body cannot inject commands.
          PR_BODY: ${{ github.event.pull_request.body }}
          # The event's head branch and head repository, forwarded as they
          # arrive. Which branch the release-automation class may act on is
          # derived from the pair by check-no-release-outputs.js
          # (effectiveHeadRef), so that rule has one home and one set of tests
          # rather than a copy in every workflow that supplies the inputs.
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          node scripts/check-docs-disposition.js "origin/$GITHUB_BASE_REF"
