name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Called by the publish workflows so a release only proceeds on a green suite
  # for the release SHA (see publish.yml / publish-desktop.yml). Replaces the old
  # standalone `release: published` trigger — running the suite via the call (not
  # a second independent run) is what makes the publish job depend on it.
  workflow_call:
    inputs:
      # Which platform a publish is releasing — scopes the suite to that
      # platform's exclusive jobs PLUS the shared/common ones, so a desktop
      # failure can't block an extension release (and vice-versa). Empty on
      # push/PR, where the `changes` path filter decides what runs. An unset/empty
      # value runs everything (fail-safe: a caller that forgets it skips nothing).
      platform:
        type: string
        required: false
        default: ''
    secrets:
      # The suite's only secret (coverage upload). Declared + passed explicitly by
      # the publish callers instead of `secrets: inherit`, so the reusable workflow
      # never receives every repo secret. Optional: direct push/PR runs read the
      # token from the repo secret context, not from a caller.
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Jobs below, and some individual steps, carry a `timeout-minutes` bound. A
  # bound is a ceiling, not a budget: it caps how long the work under it can
  # run, and it sits above what that work has been measured to take on `main`.
  # Where a number rests on something those measurements do not show on their
  # own, the note beside it says so. Raising one is an edit to its own line.

  changes:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      desktop: ${{ steps.filter.outputs.desktop }}
      shared: ${{ steps.filter.outputs.shared }}
      schema: ${{ steps.filter.outputs.schema }}
      referenceServer: ${{ steps.filter.outputs.referenceServer }}
      corpus: ${{ steps.filter.outputs.corpus }}
      ci: ${{ steps.filter.outputs.ci }}
      ciCore: ${{ steps.filter.outputs.ciCore }}
      buildScripts: ${{ steps.filter.outputs.buildScripts }}
      releasePipeline: ${{ steps.filter.outputs.releasePipeline }}
      contractDocs: ${{ steps.filter.outputs.contractDocs }}
      dispositionWorkflow: ${{ steps.filter.outputs.dispositionWorkflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            extension:
              - 'packages/extension/**'
            desktop:
              - 'packages/desktop/**'
            shared:
              - 'packages/shared/**'
            schema:
              - 'schemas/**'
            referenceServer:
              - 'reference-implementations/**'
            corpus:
              - 'corpus/**'
            # Environment-wide inputs every job's build/run depends on: this
            # workflow, the composite actions it loads, and the root npm
            # manifests. Fires the full matrix (fixes the `.github/actions/**`
            # under-trigger). Sibling workflows and inert configs
            # (.editorconfig/.prettierrc/eslint.config.js/codecov.yml) are
            # deliberately absent — the always-on lint/zizmor/actionlint/
            # coverage-upload jobs already cover them.
            ciCore:
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'package-lock.json'
            # The scripts a NON-unit test job actually executes, plus their
            # scripts/-local import/spawn closure — the only script set the
            # heavy Windows/Playwright/corpus jobs need. Kept equal to that
            # closure by scripts/check-ci-filter.js (npm run lint:ci-filter).
            buildScripts:
              - 'scripts/sync-shared.js'
              - 'scripts/inject-shared-views.js'
              - 'scripts/build-desktop-dist.js'
              - 'scripts/build-schemas.js'
              - 'scripts/build-validators.js'
              - 'scripts/corpus-compare.js'
              - 'scripts/corpus-assemble-desktop.js'
              - 'scripts/corpus-assemble-desktop-vectors.js'
              - 'scripts/sufficiency-lint.js'
            # Release-pipeline sources read as files (readFileSync, not import)
            # rather than executed: by reference-server-tests' release-exclusion
            # suite, asserting the publish pipelines and the release-output
            # guard never sweep in reference-implementations/, and by
            # unit-tests' disposition suite, holding both publish workflows to
            # the automation branch the release guards key on. A source-read
            # coupling the buildScripts closure can't model, so it gets its own
            # flag. The rule is per reading job: a file belongs here when some
            # job whose suite reads it gates on no other flag already matching
            # that file. That is what keeps the guard script listed — unit-tests
            # reaches it through the broad ci bucket, but reference-server-tests
            # is a heavy job and never gates on ci.
            releasePipeline:
              - '.github/workflows/publish.yml'
              - '.github/workflows/publish-desktop.yml'
              - 'scripts/check-no-release-outputs.js'
            # The contributor contract files, read as files by unit-tests'
            # disposition suite, which welds itself to a surface in each: the
            # governance line CONTRIBUTING fences and the PR template scaffolds,
            # held to the check's own constant; CONTRIBUTING's exemption
            # paragraph, held to every field the exemption reads and to citing
            # the release-output surface by its home rather than restating it;
            # and the shipped template itself, audited as-is so its guidance
            # comments stay inert. An edit to either file must run that suite.
            # Narrow on purpose — it gates unit-tests alone, the only job whose
            # suite reads them. Same per-reading-job rule as the flag above.
            contractDocs:
              - '.github/CONTRIBUTING.md'
              - '.github/PULL_REQUEST_TEMPLATE.md'
            # .github/workflows/docs-disposition.yml, read as a file by
            # unit-tests' release-guard suite: it holds that workflow's guard
            # step env block to the event fields the head-ref derivation is
            # written against, so an edit there must run that suite. Narrow on
            # purpose — it gates unit-tests alone, so the heavy jobs never fire
            # for a workflow only that suite reads. Same per-reading-job rule as
            # the flags above.
            dispositionWorkflow:
              - '.github/workflows/docs-disposition.yml'
            # The broad script bucket — gates unit-tests only (its shared unit
            # suite imports most scripts via packages/shared/tests/unit/check-*.test.js);
            # .c8rc.json configures that job's JS coverage.
            ci:
              - 'scripts/**'
              - '.c8rc.json'

  lint:
    needs: [changes]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the release-output guard can diff against the PR
          # base via merge-base (three-dot). Other steps don't need it but it's
          # harmless.
          fetch-depth: 0

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: Prettier check
        run: npm run lint:format ${{ runner.debug == '1' && '-- --log-level debug' || '' }}

      - name: markdownlint
        run: npm run lint:md

      # remark-validate-links (--frail): every relative doc link and heading
      # #anchor must resolve. Complements markdownlint, which does not check link
      # targets — so a moved/renamed doc that breaks a link fails here, not silently.
      - name: Validate documentation links
        run: npm run lint:links

      # Complements the link-checker above: that proves links RESOLVE; this proves
      # every tracked .md is REACHED from README.md. The reachability doctrine the
      # two enforce together is stated in docs/README.md ("Documentation map").
      - name: Validate documentation reachability
        run: npm run lint:reachability

      # scripts/area-map.json (which docs govern which code) is committed data,
      # so it can rot; this is its admission test. Red when the map goes stale
      # (a pattern matching nothing, an entry pointing at a moved file), when a
      # tracked file belongs to no area, or when a doc under docs/ is in no
      # area's doc set — "which docs govern this change?" must always resolve.
      - name: Validate area-map coverage
        run: npm run lint:area-map

      # Docs state rules as stable clause identifiers (e.g. **CP-3.**) and
      # docs/clause-registry.json records how each is verified. This keeps the
      # two in one-to-one agreement, and holds every citation either registry
      # text field carries — a row's check-ref and its justification alike — to
      # resolving against the tree, or being refused as a citation that cannot
      # identify what it names. The check's own list of citable root files is
      # held to the tracked set on every run, so a stale entry reds there
      # rather than in a row.
      - name: Validate clause-registry parity
        run: npm run lint:clause-registry

      # Every repository path a clause cites (its check-ref or justification)
      # must be governed by the doc that states the clause — so a diff to the
      # cited code cannot change what a clause stands on without priming its
      # doc. Deliberately-open couplings are a recorded allowlist in the check;
      # a new uncovered citation, or a stale allowlist entry, is red.
      - name: Validate clause-citation governance
        run: npm run lint:clause-governance

      # Every clause-bearing doc states the same preamble — the identifier
      # rules, the RFC 2119 reference, and the keyword-placement and
      # clause-scope conventions. That text is one constant in the check, with
      # each doc's prefix token and registry link computed from the registry,
      # so a carrier can only state it or red. The same check holds the
      # clause-bearing documents to the convention the preamble states: a
      # lowercase must/should/may inside a clause scope is red unless the
      # allowlist records why that sentence states no requirement. It runs here
      # for the reason the other doc gates do — the diff that breaks it is
      # often docs-only, and a docs-only PR skips every path-filtered test job.
      - name: Validate clause preambles and keyword placement
        run: npm run lint:clause-preamble

      # The suite documents the check registers enumerate their suites: in each
      # one's inventory section, the coverage tables' first column and the test
      # files that are members of the suite it documents (the check registers
      # the rule that decides that) stand in one-to-one agreement, every entry
      # of the registered hand-maintained TRACKED_FILES lists identifies one
      # tracked source, and an inventory the check can no longer read where it
      # looks is red rather than skipped. It runs here, in the always-on job,
      # because the diff that stales an inventory is often docs-only — and a
      # docs-only PR skips every path-filtered test job.
      - name: Validate test-suite inventories
        run: npm run lint:test-inventory

      # The verification documents state inventories of things that live
      # elsewhere: the relaxation kinds and their covered fields, the
      # normalized field classes, the desktop session catalogue, the predicate
      # catalogue, and the CI jobs they cite. Each inventory is held to the
      # code constant or the manifest it describes, both ways; the job cites
      # are held one-way — every cite must name a job of this workflow, and a
      # job owes no cite. It runs here for the same reason the test-inventory
      # gate does — the diff that stales a doc inventory is often docs-only,
      # and a docs-only PR skips every path-filtered test job.
      - name: Validate verification-document inventories
        run: npm run lint:verification-inventory

      # The path-filter split (which test jobs run for a given diff) is a
      # committed contract. This admission test recomputes it against the
      # workflow and reds on any drift; scripts/check-ci-filter.js is the home
      # of the complete set of invariants it holds.
      - name: Validate CI path-filter contract
        run: npm run lint:ci-filter

      # The desktop crate's command surface is a committed contract
      # (application-shell.md §DSH-1): the #[tauri::command] set, the
      # generate_handler! registration, the doc's table, the single
      # capture:action emit site, the capability grants, and the integration
      # mock's serviced-command list must all state the same surface. This
      # admission test recomputes every leg and reds on any drift.
      - name: Validate desktop command-surface contract
        run: npm run lint:command-surface

      # The extension's surface contracts are committed too: the manifest's
      # permission surface must equal the permissions doc's tables (EPM-1),
      # and the worker dispatcher's serviced message types must equal the
      # runtime doc's capture-path and panel-protocol enumerations (ERT-4).
      # This admission test recomputes both and reds on any drift.
      - name: Validate extension surface contracts
        run: npm run lint:extension-surface

      # Each platform's capture surface is a closed positive enumeration
      # (CP-14): the recorder's document listeners must equal ECP-6's
      # enumeration, the worker's capture proxies must equal the worker events
      # the ECP-7 table's event-source column names, each registered once (a
      # DOM event that column names is held to ECP-6 instead), every other
      # registration in either capture-path file — the recorder and the service
      # worker — must be admitted by role. On the desktop side the installed
      # low-level hooks must equal DCP-4's enumeration and the DCP-7
      # correlation classes must each be covered by a registered WinEvent
      # range, both diffed in both directions; only the range leg is
      # containment — every id a registered range spans must be a named class,
      # so a widened pair reds. This admission test recomputes every leg and
      # reds on any drift.
      - name: Validate capture surface enumerations
        run: npm run lint:capture-surface

      # The platform-adapter seam is a committed contract too
      # (shared-core.md §SC-3): the PlatformAdapter typedef is its one home, so
      # every member the typedef declares is implemented by every concrete
      # adapter (today the Chrome one and the Tauri one), and every member all
      # of them implement is declared in the typedef. This admission test reads
      # the typedef's properties and each adapter's default-exported literal
      # and reds on drift in either direction;
      # scripts/check-adapter-surface.js is the home of the complete red set.
      - name: Validate platform-adapter surface contract
        run: npm run lint:adapter-surface

      # The CI guides state closures the tree can silently outgrow. This
      # admission test recomputes them against the tree and reds on any
      # drift; scripts/check-doc-closure.js is the home of the complete
      # recomputed set.
      - name: Validate doc-closure claims
        run: npm run lint:doc-closure

      # The session-format document restates what the schemas define, and a
      # schema change that quietly falsifies the prose is a legitimate MINOR
      # release: every surface that restates the schemas' authority must keep
      # stating it (SF-1), the additionalProperties posture over both
      # composed schemas must be the one each object's class states (SF-14),
      # and the field tables must agree with the defs they describe. This
      # admission test recomputes every leg and reds on any drift.
      - name: Validate schema echoes
        run: npm run lint:schema-echo

      # An ignore rule has no effect on an already-tracked file, so the tracked
      # set and the .gitignore rules can disagree silently. This asserts they
      # never do — every tracked file is one those rules admit.
      - name: Validate ignore-rule agreement
        run: npm run lint:tracked-ignored

      # Every Actions `uses:` must be pinned to a commit SHA, not a mutable tag.
      # Dependabot bumps the SHA + `# version` comment weekly.
      - name: Check GitHub Actions are SHA-pinned
        run: npm run check:action-pins

      # The Clippy gate's invocation has one home (docs/guides/ci.md §CI-1), which
      # any other statement of it repeats exactly, and is run in the Rust jobs
      # below. This admission test holds them together —
      # the gates row's own command, directory, and job set against the clippy
      # steps, which spell one command between them, and each backticked spelling
      # in tracked markdown that opens with the command, read outside fenced
      # blocks, against those run lines — without running the tool;
      # scripts/check-clippy-invocation.js is the home of the complete red set
      # and of the limits that read leaves review-held.
      - name: Validate the stated clippy invocation
        run: npm run check:clippy-invocation

      # Guard 2: release-output guard. On a normal feature branch it FAILS if the
      # branch touched release-only outputs (schemas/dist/ or a delta `version`).
      # On the automation branch the release pipeline opens
      # (automated/version-table-update) it instead POSITIVELY validates that the
      # PR is exactly the mechanical regeneration — only release outputs, and a
      # dist/ that composes from source. The script picks its mode from the head
      # branch it derives out of the inputs below. Only meaningful on PRs, where
      # we have a base branch to diff against; skipped on push/release.
      - name: No release-only outputs on PR
        if: github.event_name == 'pull_request'
        env:
          # The event's head branch and head repository, forwarded as they
          # arrive. The script derives the branch its mode switch may act on
          # from the pair (effectiveHeadRef), so a branch on a fork cannot
          # select POSITIVE mode by name alone and the rule stays testable in
          # one place rather than copied into each workflow.
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          node scripts/check-no-release-outputs.js "origin/$GITHUB_BASE_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt check
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --check ${{ runner.debug == '1' && '-- --verbose' || '' }}

  dependency-audit:
    # Sized for the run the observed sample does not contain: the one where a
    # cargo-deny cache miss adds a `cargo install` to this job. That install is
    # skipped on every sampled run, so there is no measured step duration to
    # size a step bound from — this job's own bound covers it instead.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      # --- npm side: advisories (npm audit) + license gate (cargo-deny is
      # Rust-only, so npm keeps its own advisory audit). ---
      - name: Audit npm dependencies (advisories)
        run: npm audit --audit-level=high --package-lock-only

      # The npm license gate scans every real install root (this is NOT an
      # npm-workspaces repo), so each root needs its node_modules present.
      - name: Install extension dependencies
        run: cd packages/extension && npm ci

      - name: Install extension e2e dependencies
        run: cd packages/extension/tests/e2e && npm ci

      - name: Install desktop integration dependencies
        run: cd packages/desktop/tests/integration && npm ci

      - name: Check npm dependency licenses (default-deny allowlist)
        run: npm run check:licenses

      # --- Rust side: consolidated on cargo-deny (replaces cargo-audit). Licenses
      # and advisories run as SEPARATE steps so a red gate shows which one failed;
      # both block (this job is required by ci-gate and by the publish workflows).
      # Config + the advisory ignore list live in packages/desktop/src-tauri/deny.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo-deny
        id: cache-cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.19.9

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Check Rust dependency licenses (default-deny allowlist)
        working-directory: packages/desktop/src-tauri
        run: cargo deny check licenses

      - name: Audit Rust dependencies (advisories)
        working-directory: packages/desktop/src-tauri
        run: cargo deny check advisories

  unit-tests:
    needs: [lint, changes]
    if: |
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.schema == 'true' ||
      needs.changes.outputs.corpus == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.ciCore == 'true' ||
      needs.changes.outputs.releasePipeline == 'true' ||
      needs.changes.outputs.contractDocs == 'true' ||
      needs.changes.outputs.dispositionWorkflow == 'true' ||
      github.event_name == 'release' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install extension test dependencies
        run: cd packages/extension && npm ci

      - name: Check version tables in sync
        run: node scripts/check-version-sync.js

      # Advisory only (never blocks): surfaces how the next release will version
      # any schema change in this PR. Deltas are intentionally NOT bumped during
      # development — auto-version-schemas.js does that mechanically at release
      # time — so this is informational, not a gate.
      - name: Schema version impact (advisory)
        continue-on-error: true
        run: node scripts/auto-version-schemas.js --check

      - name: Sync shared code
        run: npm run sync-shared

      - name: Build desktop dist
        run: npm run build:desktop-dist

      - name: Verify sync-shared output is fresh
        run: |
          git diff --exit-code packages/*/shared/ packages/extension/sidepanel/index.html packages/desktop/src/index.html || (echo "ERROR: sync-shared produced changes — run 'npm run sync-shared' locally and commit" && exit 1)

      - name: Run shared and desktop tests with coverage
        run: npm run test:coverage

      - name: Run extension unit tests with coverage
        run: cd packages/extension && npm run test:coverage

      # Coverage is uploaded to Codecov by the terminal `coverage-upload` job,
      # not here. Each test job publishes its lcov as an artifact so all uploads
      # land in one tight window — this keeps the Codecov PR comment from sitting
      # on a stale intermediate value while jobs finish minutes apart.
      - name: Stage JS unit coverage
        run: |
          mkdir -p coverage-artifacts
          cp coverage/lcov.info coverage-artifacts/shared-desktop-unit.lcov
          cp packages/extension/coverage/lcov.info coverage-artifacts/extension-unit.lcov

      - name: Upload JS unit coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-unit-javascript
          path: coverage-artifacts/*.lcov
          retention-days: 1

  extension-e2e-tests:
    needs: [lint, changes]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (needs.changes.outputs.extension == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.schema == 'true' ||
          needs.changes.outputs.referenceServer == 'true' ||
          needs.changes.outputs.corpus == 'true' ||
          needs.changes.outputs.ciCore == 'true' ||
          needs.changes.outputs.buildScripts == 'true')) ||
      ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
        (inputs.platform == '' || inputs.platform == 'extension'))
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Sync shared code
        run: npm run sync-shared

      - name: Install Playwright dependencies
        working-directory: packages/extension/tests/e2e
        run: npm ci

      # The browser download can hang without a byte of progress, so the step
      # carries its own bound instead of eating the job's. The cache keys on
      # this suite's lockfile, which pins the browser build Playwright fetches;
      # on a hit the install finds the browser in place and skips the download,
      # while --with-deps still provides the OS packages each run. Saves happen
      # only on the main branch — pull-request runs restore from main's entry
      # and never write, so the repository's shared cache budget carries one
      # entry per installing suite rather than one per ref.
      - name: Restore Playwright browser cache
        id: pw-browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/extension/tests/e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: packages/extension/tests/e2e
        timeout-minutes: 10
        run: npx playwright install chromium --with-deps

      - name: Save Playwright browser cache
        if: github.ref == 'refs/heads/main' && steps.pw-browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/extension/tests/e2e/package-lock.json') }}

      # This step spends most of the job's budget, so it carries a bound of its
      # own: inside the job bound alone, a browser that stops responding
      # mid-suite is indistinguishable from a suite that is merely slow. Sized
      # against this step's own observed maximum, whose run-to-run spread the
      # margin has to leave room above.
      - name: Run Playwright tests
        working-directory: packages/extension/tests/e2e
        timeout-minutes: 25
        run: xvfb-run npx playwright test

      # Superset of truth production: the vectors config also produces the
      # conformance vectors and asserts each produced vector deep-equals its
      # committed file (the produce-stage oracle). Truth envelopes are emitted
      # unchanged, so the Corpus truth diff step below still validates them. The
      # structural vector hygiene locks run in the unit-tests job via test:shared.
      - name: Produce capture corpus + conformance vectors (extension)
        working-directory: packages/extension/tests/e2e
        run: xvfb-run npx playwright test --config playwright.vectors.config.js

      - name: Corpus truth diff
        run: npm run corpus:check

      - name: Upload corpus output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-extension-output
          path: corpus/out/
          retention-days: 7

      - name: Upload extension E2E coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-e2e-javascript
          path: packages/extension/tests/e2e/coverage/lcov.info
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: packages/extension/tests/e2e/test-results/
          retention-days: 7

  desktop-rust-tests:
    needs: [lint, changes]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (needs.changes.outputs.desktop == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.corpus == 'true' ||
          needs.changes.outputs.schema == 'true' ||
          needs.changes.outputs.ciCore == 'true' ||
          needs.changes.outputs.buildScripts == 'true')) ||
      ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
        (inputs.platform == '' || inputs.platform == 'desktop'))
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          # This job runs the FULL test + coverage pipeline (real UIA + enigo
          # input), so it only lists platforms that have a working capture
          # backend AND a cross-platform test path. Add Linux (#84) here when
          # its backend lands — at which point this job and desktop-cross-compile
          # are intended to converge into one matrix (#125). (macOS dropped — #83.)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      # The path follows the sibling tool caches — cargo-mutants in
      # mutation.yml and cargo-deny in the dependency-audit job above — and
      # spells `.exe` because this job's matrix runs on Windows runners, where
      # `cargo install` produces `cargo-llvm-cov.exe`. So it names the file the
      # install actually leaves behind, and it tracks the matrix: a leg on
      # another platform needs a path matching what that platform's install
      # writes. The path is what decides whether anything is saved at all: one
      # naming no existing file makes the post-job save a no-op and every later
      # restore a miss, so the tool is re-fetched and re-compiled on every run.
      # (cargo-mutants spells the suffix for the same reason; the Linux-only
      # cargo-deny cache needs none.)
      #
      # The key's version segment names the version the install below pins,
      # after cargo-deny, whose segment and pin state the same version. That is
      # what keeps the segment truthful — the binary a hit serves is the one
      # the segment claims — and moving to a new release is then one deliberate
      # edit to both, with the changed key making that release refetch.
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov.exe
          key: ${{ runner.os }}-cargo-llvm-cov-0.8.7

      # Reaches crates.io and compiles, so it carries a bound of its own, sized
      # against this step's observed maximum — a registry that stops answering
      # ends here, well inside the job's own cap.
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      # The key pins the entry to the current lockfile; `restore-keys` adds the
      # fallback the run takes when that key is new. Candidates come only from
      # entries saved under this same path list, so what the prefix can reach
      # is this platform's cargo trees: earlier lockfile generations of this
      # key, which several jobs write, and — since the key carries no family
      # segment to stay inside — the cross-compile job's trees as well. What
      # any of them reliably supplies is a populated registry; the target
      # directory it carries was built by whichever job saved it, so cargo
      # revalidates that rather than trusting it. The floor is the cold start a
      # bare key gives. A save always writes the exact key, so each lockfile
      # still gets its own full entry.
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist directory
        working-directory: packages/desktop
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null
        shell: pwsh

      - name: Run Clippy lints
        working-directory: packages/desktop/src-tauri
        run: cargo clippy --all-targets ${{ runner.debug == '1' && '-v' || '' }} -- -D warnings

      # Coverage is split by pyramid layer into two llvm-cov runs so each lands
      # under the correct Codecov flag (unit vs integration). The split is
      # fully auto-discovered from the test sources — there are no test-name
      # lists in this workflow:
      #
      #   ci-skip     — a test file containing the `ci-skip` marker in its source
      #                 is excluded from CI entirely (e.g. file_dialog_test, which
      #                 launches Notepad — not reliable on CI runners).
      #   integration — synthesises real OS input, identified by importing the
      #                 `enigo` crate (drives real windows).
      #   unit        — every other test file at the top of tests/ (deterministic
      #                 logic, state machines, property tests) + `--lib` in-module
      #                 tests. The glob below is `tests/*.rs`, so this step reads
      #                 the top level only.
      #
      # A new test classifies itself from its own source: add `use enigo` for
      # integration (otherwise unit), and add a `ci-skip` comment to opt out of
      # CI. Nothing to edit here.
      - name: Discover Rust test layers
        working-directory: packages/desktop/src-tauri
        shell: bash
        run: |
          unit_args=""
          integration_args=""
          for path in tests/*.rs; do
            name=$(basename "$path" .rs)
            if grep -qE '(^|[^[:alnum:]])ci-skip([^[:alnum:]]|$)' "$path"; then
              echo "Skipping $name (ci-skip marker)"
              continue
            fi
            if grep -qE '^use enigo' "$path"; then
              integration_args="$integration_args --test $name"
            else
              unit_args="$unit_args --test $name"
            fi
          done
          echo "Unit binaries:$unit_args"
          echo "Integration binaries:$integration_args"
          echo "RUST_UNIT_TEST_ARGS=$unit_args" >> "$GITHUB_ENV"
          echo "RUST_INTEGRATION_TEST_ARGS=$integration_args" >> "$GITHUB_ENV"

      - name: Run Rust unit tests with coverage
        working-directory: packages/desktop/src-tauri
        shell: bash
        run: |
          # RUST_UNIT_TEST_ARGS is a space-separated arg list (set into $GITHUB_ENV
          # above); it stays unquoted on purpose so each filter becomes a separate
          # cargo argument (and an empty value expands to nothing).
          # shellcheck disable=SC2086
          cargo llvm-cov --lib $RUST_UNIT_TEST_ARGS --ignore-filename-regex "(lib|main)\.rs$" --lcov --output-path coverage-unit.lcov ${{ runner.debug == '1' && '-- --nocapture' || '' }}

      - name: Run Rust integration tests with coverage
        working-directory: packages/desktop/src-tauri
        shell: bash
        # --test-threads=1: every integration test is #[serial] (they share the
        # OS input layer via enigo), so they never run concurrently anyway.
        # libtest's default parallel runner still pre-spawns all test threads,
        # leaving all-but-one blocked on the serial lock — and its 60s
        # "still running" timer counts that blocked wait, emitting misleading
        # "has been running for over 60 seconds" warnings for tests that have
        # done no work. Running single-threaded removes the phantom warnings at
        # no cost (the suite was already fully serialized).
        run: |
          # RUST_INTEGRATION_TEST_ARGS is a space-separated arg list (set into
          # $GITHUB_ENV above); it stays unquoted on purpose so each filter becomes
          # a separate cargo argument (and an empty value expands to nothing).
          # shellcheck disable=SC2086
          cargo llvm-cov $RUST_INTEGRATION_TEST_ARGS --ignore-filename-regex "(lib|main)\.rs$" --lcov --output-path coverage-integration.lcov -- --test-threads=1 ${{ runner.debug == '1' && '--nocapture' || '' }}

      - name: Upload Rust coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-rust
          path: |
            packages/desktop/src-tauri/coverage-unit.lcov
            packages/desktop/src-tauri/coverage-integration.lcov
          retention-days: 1

      - name: Upload corpus event dumps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-desktop-events
          path: corpus/out/desktop-windows-events/
          retention-days: 1

  # Assemble the desktop corpus event dumps through the real frontend pipeline
  # and diff the envelopes against committed truth (docs/verification/scripted-truth-corpus.md). Runs on
  # ubuntu so the diff logic lives in one place and the Windows job stays lean.
  desktop-corpus-diff:
    needs: [desktop-rust-tests, changes]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (needs.changes.outputs.desktop == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.corpus == 'true' ||
          needs.changes.outputs.schema == 'true' ||
          needs.changes.outputs.ciCore == 'true' ||
          needs.changes.outputs.buildScripts == 'true')) ||
      ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
        (inputs.platform == '' || inputs.platform == 'desktop'))
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Sync shared code
        run: npm run sync-shared

      - name: Download corpus event dumps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-desktop-events
          path: corpus/out/desktop-windows-events/

      - name: Assemble desktop corpus envelopes
        run: npm run corpus:assemble:desktop

      - name: Corpus truth diff (desktop)
        run: npm run corpus:check:desktop

      - name: Upload corpus output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-desktop-output
          path: corpus/out/
          retention-days: 7

  # Produce the desktop conformance vector on a PINNED Windows image (STC-18).
  # The full-window UIA snapshot retains the OS-chrome subtree (window included —
  # the spec's desktop bound scope), whose structure/ids are Windows-version-
  # bounded; pinning windows-2022 (NOT the inherited windows-latest) makes an OS
  # image bump a DELIBERATE, reviewed re-baseline of the committed vector rather
  # than a silent churn. This job only PRODUCES (emits the vector source dump as
  # an artifact); the ubuntu desktop-vectors-diff job does the normalized diff +
  # locks (the Rust job has no Node) — the shipped desktop-rust-tests ->
  # desktop-corpus-diff produce/diff split (STC-8), applied to vectors.
  desktop-vectors-produce:
    needs: [lint, changes]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (needs.changes.outputs.desktop == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.corpus == 'true' ||
          needs.changes.outputs.ciCore == 'true' ||
          needs.changes.outputs.buildScripts == 'true')) ||
      ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
        (inputs.platform == '' || inputs.platform == 'desktop'))
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # Same key and fallback posture as the desktop-rust-tests cargo cache,
      # which carries the reasoning for both.
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist directory
        working-directory: packages/desktop
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null
        shell: pwsh

      # Produces corpus/out/desktop-windows-vectors/<fixture>.vecdump.json via
      # real UIA capture over the vector fixture window. #[serial] + single-thread
      # for the shared input layer (same as the corpus integration tests).
      - name: Produce desktop conformance vector
        working-directory: packages/desktop/src-tauri
        run: cargo test --test corpus_capture v_vector_fixture -- --test-threads=1 ${{ runner.debug == '1' && '--nocapture' || '' }}

      - name: Upload desktop vector dumps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-desktop-vectors
          path: corpus/out/desktop-windows-vectors/
          retention-days: 1

  # Assemble the desktop vector dump into its committed shape, NORMALIZED-diff it
  # against the committed vector (the produce==committed oracle — normalized, not
  # byte-identical, reusing the shipped comparator class rules — STC-18/STC-19), and
  # run the structural hygiene locks + meta-schema. Runs on ubuntu so the diff logic
  # lives in one place (this ubuntu normalized diff IS the reproduce+drift gate;
  # no same-OS Windows probe). Mirrors the shipped desktop-corpus-diff job (STC-8).
  desktop-vectors-diff:
    needs: [desktop-vectors-produce, changes]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (needs.changes.outputs.desktop == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.corpus == 'true' ||
          needs.changes.outputs.ciCore == 'true' ||
          needs.changes.outputs.buildScripts == 'true')) ||
      ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
        (inputs.platform == '' || inputs.platform == 'desktop'))
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Sync shared code
        run: npm run sync-shared

      - name: Download desktop vector dumps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-desktop-vectors
          path: corpus/out/desktop-windows-vectors/

      - name: Assemble + normalized diff (desktop vectors)
        run: npm run vectors:assemble:desktop

      - name: Vector hygiene locks + meta-schema (desktop)
        run: node --test packages/shared/tests/unit/conformance-vectors.test.js

      - name: Upload vector output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-desktop-vectors-output
          path: corpus/out/
          retention-days: 7

  # Cross-platform COMPILE + LINT gate (#97). This is the comprehensive "builds
  # on every platform we prepare for" job: on each platform of its matrix —
  # Windows and Linux — it compiles every Cargo target the `cargo check` step
  # below names, then runs the Clippy gate over the crate, whose invocation the
  # Clippy row states (docs/guides/ci.md §CI-1). It runs NO
  # tests. What a platform lints is what that platform compiles: a
  # test binary gated to Windows is empty on Linux, so the Linux leg holds the
  # seam and the sources that compile everywhere rather than the Windows-only
  # test helpers (the deliberate trade-off, recorded in
  # packages/desktop/src-tauri/tests/capture_integration.rs). It complements the
  # desktop-rust-tests job, which runs the full test+coverage pipeline only on
  # the platforms that have a real capture backend (Windows today). Keeping the
  # full platform list here means the cross-platform seam (the no-op
  # `capture::stub` backend behind `Capture` on non-Windows) is proven to keep
  # compiling as the code evolves toward native Linux (#84) support.
  # (macOS was dropped — see #83 — as it has no free code-signing path and
  # unsigned apps are unusable for non-technical users.)
  #
  # NOTE (#125): once a non-Windows backend gains a working test+coverage path,
  # this test-free job and desktop-rust-tests are intended to converge into a
  # single full-pipeline matrix. Until then they stay split — see #125.
  desktop-cross-compile:
    needs: [lint, changes]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (needs.changes.outputs.desktop == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.ciCore == 'true')) ||
      ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
        (inputs.platform == '' || inputs.platform == 'desktop'))
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      # Tauri's Linux build links against WebKitGTK/GTK; these dev packages must
      # be present for `cargo check` to resolve the tauri build script.
      # (macOS uses the system WebKit — no install needed.)
      #
      # The index refresh is wrapped in the retry loop the actionlint image
      # pull already uses: re-running it asks for the same state, so a repeat
      # is honest, and a refresh still failing on the last attempt fails the
      # step. The package install that follows runs once — retrying it would be
      # defensible on the same grounds, and retrying the refresh alone is the
      # narrower move taken here. The step bound covers both legs, sized
      # against this step's observed maximum, so a mirror that stops answering
      # ends the step here rather than consuming the job's whole cap.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            if [ "$i" = 3 ]; then echo "::error::apt-get update failed after 3 attempts"; exit 1; fi
            echo "apt-get update failed (attempt $i) — retrying in 5s…"; sleep 5
          done
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-xcompile-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          # This key carries a family segment, so the prefix stays inside it: a
          # lockfile bump warm-starts from the previous cross-compile entry — a
          # tree built by the same command on the same platform — leaving this
          # platform's other cargo trees out of the fallback. As at the
          # desktop-rust-tests cache, the save still writes the exact key, so
          # each lockfile gets its own full entry either way.
          restore-keys: ${{ runner.os }}-cargo-xcompile-

      - name: Create frontend dist directory
        shell: bash
        run: mkdir -p packages/desktop/dist

      - name: cargo check (all targets)
        working-directory: packages/desktop/src-tauri
        run: cargo check --all-targets ${{ runner.debug == '1' && '-v' || '' }}

      - name: Clippy
        working-directory: packages/desktop/src-tauri
        run: cargo clippy --all-targets ${{ runner.debug == '1' && '-v' || '' }} -- -D warnings

  desktop-integration-tests:
    needs: [lint, changes]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        (needs.changes.outputs.desktop == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.schema == 'true' ||
          needs.changes.outputs.referenceServer == 'true' ||
          needs.changes.outputs.ciCore == 'true' ||
          needs.changes.outputs.buildScripts == 'true')) ||
      ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
        (inputs.platform == '' || inputs.platform == 'desktop'))
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Sync shared code and build desktop dist
        run: npm run sync-shared && npm run build:desktop-dist

      - name: Install desktop Playwright dependencies
        working-directory: packages/desktop/tests/integration
        run: npm ci

      # Same bound and cache posture as the extension E2E job's browser
      # install: the download can hang without progress, this suite's lockfile
      # pins the browser build the cache keys on, and saves happen only on the
      # main branch.
      - name: Restore Playwright browser cache
        id: pw-browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/desktop/tests/integration/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: packages/desktop/tests/integration
        timeout-minutes: 10
        run: npx playwright install chromium --with-deps

      - name: Save Playwright browser cache
        if: github.ref == 'refs/heads/main' && steps.pw-browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/desktop/tests/integration/package-lock.json') }}

      - name: Run desktop Playwright tests
        working-directory: packages/desktop/tests/integration
        run: npx playwright test

      - name: Upload desktop integration coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-integration-javascript
          path: packages/desktop/tests/integration/coverage/lcov.info
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-playwright-report
          path: packages/desktop/tests/integration/test-results/
          retention-days: 7

  # Reference Sync Server tests (repo/testing artifact, excluded from releases).
  # Runs the server's own pyramid-layered suites — tests/unit + tests/integration
  # under reference-implementations/sync-server — which run NOWHERE else in CI.
  # The unit layer includes the samples-conformance guard: it validates the
  # bundled seed samples against the platform schemas composed from source, so a
  # schema-shape change that a sample no longer matches fails HERE, on the PR.
  # Gated on the reference server, the schemas it validates against, and shared
  # (the validator/digest the conformance test composes through).
  reference-server-tests:
    needs: [lint, changes]
    if: |
      needs.changes.outputs.referenceServer == 'true' ||
      needs.changes.outputs.schema == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.ciCore == 'true' ||
      needs.changes.outputs.buildScripts == 'true' ||
      needs.changes.outputs.releasePipeline == 'true' ||
      github.event_name == 'release' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The reference server has no runtime deps, but the samples-conformance
      # unit test composes the platform schema (scripts/build-schemas.js → ajv +
      # prettier) — all root devDependencies — so install at the repo root.
      - name: Install root dependencies
        run: npm ci

      - name: Run reference sync server tests (unit + integration)
        working-directory: reference-implementations/sync-server
        run: npm test

  # Terminal coverage upload. Every test job publishes its lcov as an artifact
  # rather than uploading to Codecov itself; this job collects them all and
  # uploads back-to-back in one tight window. Two reasons:
  #   1. The Codecov PR comment updates on every upload it receives. When
  #      uploads were spread across jobs finishing minutes apart, the comment
  #      sat on stale intermediate values (and sometimes never caught the last
  #      one). Bunching the uploads makes it converge immediately.
  #   2. A single place owns the flag taxonomy (pyramid layer x language).
  #
  # Each upload step is guarded by hashFiles() so a path-filter-skipped test
  # job (whose artifact is therefore absent) is silently ignored. Codecov's
  # carryforward keeps that flag's last-known coverage in the meantime.
  #
  # This job ALWAYS runs (never skipped by path filters). On a docs-/CI-only PR
  # every test job is skipped, so no artifacts exist — in that case the final
  # step issues a Codecov `empty-upload`, which tells Codecov the commit has no
  # coverage to report and to pass its status checks. Without this, the required
  # codecov/project and codecov/patch checks would never be reported on such
  # PRs and GitHub would block them on "Expected — waiting" forever.
  coverage-upload:
    needs:
      - unit-tests
      - extension-e2e-tests
      - desktop-rust-tests
      - desktop-integration-tests
    if: always()
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: coverage-artifacts

      # When the pattern matches exactly one artifact, download-artifact writes
      # its files into the path directly instead of a per-artifact
      # subdirectory. The upload guards below read fixed per-artifact paths, so
      # restore that layout for the flattened case. The unit-JS and Rust files
      # carry unique names; a flat lcov.info is routed by the paths its records
      # cover, which the two producing suites keep disjoint (extension sources
      # vs desktop sources).
      - name: Restore per-artifact layout for a single-artifact download
        run: |
          move() { mkdir -p "coverage-artifacts/$2" && mv "coverage-artifacts/$1" "coverage-artifacts/$2/$1"; }
          for f in shared-desktop-unit.lcov extension-unit.lcov; do
            if [ -f "coverage-artifacts/$f" ]; then move "$f" coverage-unit-javascript; fi
          done
          for f in coverage-unit.lcov coverage-integration.lcov; do
            if [ -f "coverage-artifacts/$f" ]; then move "$f" coverage-rust; fi
          done
          if [ -f coverage-artifacts/lcov.info ]; then
            if grep -qm1 '^SF:packages/extension/' coverage-artifacts/lcov.info; then
              move lcov.info coverage-e2e-javascript
            else
              move lcov.info coverage-integration-javascript
            fi
          fi

      - name: Detect whether any coverage was produced
        id: detect
        run: |
          if [ -n "$(find coverage-artifacts -name '*.lcov' -o -name 'lcov.info' 2>/dev/null)" ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unit JS coverage to Codecov
        if: hashFiles('coverage-artifacts/coverage-unit-javascript/*.lcov') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage-artifacts/coverage-unit-javascript/shared-desktop-unit.lcov,coverage-artifacts/coverage-unit-javascript/extension-unit.lcov
          disable_search: true
          flags: unit,javascript
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: ${{ runner.debug == '1' }}

      - name: Upload extension E2E coverage to Codecov
        if: hashFiles('coverage-artifacts/coverage-e2e-javascript/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage-artifacts/coverage-e2e-javascript/lcov.info
          disable_search: true
          flags: e2e,javascript
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: ${{ runner.debug == '1' }}

      - name: Upload Rust unit coverage to Codecov
        if: hashFiles('coverage-artifacts/coverage-rust/coverage-unit.lcov') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage-artifacts/coverage-rust/coverage-unit.lcov
          disable_search: true
          flags: unit,rust
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: ${{ runner.debug == '1' }}

      - name: Upload Rust integration coverage to Codecov
        if: hashFiles('coverage-artifacts/coverage-rust/coverage-integration.lcov') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage-artifacts/coverage-rust/coverage-integration.lcov
          disable_search: true
          flags: integration,rust
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: ${{ runner.debug == '1' }}

      - name: Upload desktop integration JS coverage to Codecov
        if: hashFiles('coverage-artifacts/coverage-integration-javascript/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage-artifacts/coverage-integration-javascript/lcov.info
          disable_search: true
          flags: integration,javascript
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: ${{ runner.debug == '1' }}

      # No test job produced coverage (docs-/CI-only PR). Tell Codecov the
      # commit is intentionally coverage-free so it posts passing status checks
      # instead of leaving the required project/patch checks unreported.
      - name: Codecov empty upload (no coverage on this commit)
        if: steps.detect.outputs.has_coverage == 'false'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          run_command: 'empty-upload'
          force: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: ${{ runner.debug == '1' }}

  # Static analysis of the workflows themselves (template injection, dangerous
  # triggers, cache poisoning, token scope, etc.). Accepted findings are
  # documented in .github/zizmor.yml; anything new fails the gate. The tool
  # version is pinned so a zizmor release can't surprise-break CI.
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.26.1
          advanced-security: false
          inputs: .github/workflows/

  # Lints the workflow files themselves (syntax, expression typos, and shellcheck
  # on run: scripts). Uses the pinned actionlint Docker image so CI matches the
  # local `docker run rhysd/actionlint` check; intentional shellcheck exceptions
  # are annotated inline with `# shellcheck disable=…`.
  actionlint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # Pre-pull with retries — Docker Hub occasionally times out, and a blocking
        # gate shouldn't fail CI for a transient registry hiccup. The run then uses
        # the now-local image and won't re-pull.
        run: |
          img=rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          for i in 1 2 3; do
            docker pull "$img" && break
            if [ "$i" = 3 ]; then echo "::error::docker pull failed after 3 attempts"; exit 1; fi
            echo "docker pull failed (attempt $i) — retrying in 5s…"; sleep 5
          done
          docker run --rm -v "$PWD:/repo" --workdir /repo "$img" -color

  ci-gate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - lint
      - dependency-audit
      - unit-tests
      - extension-e2e-tests
      - desktop-rust-tests
      - desktop-corpus-diff
      - desktop-vectors-produce
      - desktop-vectors-diff
      - desktop-cross-compile
      - desktop-integration-tests
      - reference-server-tests
      - coverage-upload
      - zizmor
      - actionlint
    steps:
      - name: Check job results
        run: |
          results=("${{ needs.changes.result }}" "${{ needs.lint.result }}" "${{ needs.dependency-audit.result }}" "${{ needs.unit-tests.result }}" "${{ needs.extension-e2e-tests.result }}" "${{ needs.desktop-rust-tests.result }}" "${{ needs.desktop-corpus-diff.result }}" "${{ needs.desktop-vectors-produce.result }}" "${{ needs.desktop-vectors-diff.result }}" "${{ needs.desktop-cross-compile.result }}" "${{ needs.desktop-integration-tests.result }}" "${{ needs.reference-server-tests.result }}" "${{ needs.coverage-upload.result }}" "${{ needs.zizmor.result }}" "${{ needs.actionlint.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
