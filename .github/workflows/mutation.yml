name: Mutation Testing

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Every job below carries a `timeout-minutes` bound. Some individual steps
  # carry one too, each with a note saying why it needs its own. A bound is a
  # ceiling, not a budget: it caps how long the work under it can run, and it
  # sits above what that work has been measured to take across this workflow's
  # own past runs. Raising one is an edit to its own line.

  stryker-shared:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The shared kill set includes suites that read gitignored build output a
      # checkout does not carry, and today that output is one directory:
      # packages/shared/generated/, the platform import validators. Two listed
      # suites need it — sync-client.test.js runs the real generated validators
      # against its frozen fixtures, and generated-validators.test.js imports
      # those artifacts as its whole subject. `npm run sync-shared` produces
      # them, regeneration being its first step. Nothing else in the list reads
      # build output at all: the remaining listed suites read tracked sources —
      # the platform panel sources and shells, the extension manifest, and the
      # repo's schema source layers under schemas/, which the two schema suites
      # compose from by their own statement rather than reading schemas/dist/.
      # So no listed suite depends on the synced packages/*/shared/ copies this
      # step also writes.
      - name: Sync shared code
        run: npm run sync-shared

      - name: Run Stryker — shared package
        run: npm run test:mutation ${{ runner.debug == '1' && '-- --logLevel trace' || '' }}

      - name: Upload shared mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-shared
          path: reports/mutation/
          retention-days: 30

  stryker-extension:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install extension test dependencies
        run: cd packages/extension && npm ci

      - name: Sync shared code
        run: npm run sync-shared

      - name: Run Stryker — extension
        run: npm run test:mutation:extension ${{ runner.debug == '1' && '-- --logLevel trace' || '' }}

      - name: Upload extension mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-extension
          path: reports/mutation-extension/
          retention-days: 30

  stryker-desktop:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Sync shared code
        run: npm run sync-shared

      - name: Build desktop dist
        run: npm run build:desktop-dist

      - name: Run Stryker — desktop
        run: npm run test:mutation:desktop ${{ runner.debug == '1' && '-- --logLevel trace' || '' }}

      - name: Upload desktop mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-desktop
          path: reports/mutation-desktop/
          retention-days: 30

  # Rust mutation testing, scoped to the module set
  # packages/desktop/src-tauri/.cargo/mutants.toml's examine_globs enumerates
  # (that file also records why the live-input capture path is deliberately out
  # of scope). Measurement posture for now: missed mutants are reported in the
  # run summary, not failing — once a few weekly runs establish the baseline,
  # drop the exit-code tolerance below so a regression reddens the run like the
  # Stryker jobs do.
  cargo-mutants-desktop:
    timeout-minutes: 180
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/debug-env

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # The key's version segment states the version the install below pins, in
      # full, so that bumping the pin misses this cache and fetches the new
      # binary. A segment shortened to fewer components would keep matching
      # across a patch bump and restore the old binary under a key that still
      # looked current, leaving the run on a version the file no longer names.
      # (The cargo-deny cache in the test workflow spells its pin the same way.)
      - name: Cache cargo-mutants
        id: cache-cargo-mutants
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants.exe
          key: ${{ runner.os }}-cargo-mutants-27.1.0

      # Reaches crates.io and compiles, so it carries a bound of its own, sized
      # above this step's observed maximum over the runs where the cache missed
      # and it ran — a registry that stops answering ends here, leaving the
      # mutation run that follows the budget it needs.
      - name: Install cargo-mutants
        if: steps.cache-cargo-mutants.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: cargo install cargo-mutants --version 27.1.0 --locked

      # The `mutation` family. Its key shape, its split, and its save's gate are
      # the desktop-rust-tests cargo block's in test.yml, which carries the
      # reasoning for all four families; two things are this family's own.
      #
      # It caches the REGISTRY ONLY — no `target` directory. `cargo mutants
      # --in-place` mutates and builds in the real tree, so the tree this job
      # ends with holds fingerprints for mutated sources; seeding a later run
      # from it has produced stale-fingerprint builds. The registry and the git
      # checkouts carry no such state, so they are what this family stores.
      #
      # That path list is this family's alone, and a restore candidate — exact
      # or by prefix — comes only from entries saved under the SAME path list.
      # So nothing else can reach this family's entries and it can reach
      # nothing else's: its `restore-keys` names its own prefix and stops
      # there, because any wider prefix would be dead weight. The honest cost:
      # this job runs weekly and cache entries are evicted after seven days of
      # inactivity, so a missed week starts fully cold — a registry refetch on
      # top of the baseline build this job performs anyway. That steady state
      # is accepted design, not a defect to watch.
      - name: Restore cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mutation-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutation-

      # The Tauri build script only needs the frontend dist directory to exist.
      - name: Create frontend dist directory
        working-directory: packages/desktop
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null
        shell: pwsh

      # --in-place: the build reads ../dist, which sits outside the cargo tree,
      # so mutants must build in the real tree (serially) rather than in a copy.
      # Exit codes 2 (missed mutants) and 3 (a mutant timed out — a normal
      # mutation outcome) are tolerated while this job is measuring its
      # baseline; a genuine build/tool failure still fails the job.
      #
      # Nearly all of the job's elapsed time goes here, so this step carries a
      # bound of its own: under the job bound alone, a run that has stopped
      # progressing looks like one still working through a long mutant list. It
      # is an outer wall around the whole run, distinct from the per-mutant
      # timeout the tool applies itself — the one whose expiry reports as the
      # tolerated outcome above. Sized above this step's own observed maximum,
      # and below the job bound so the steps after it still have room: the cache
      # save below — the half of the split this step's work populates — and then
      # the run summary and the artifact upload, which are what report the
      # outcome. This STEP's bound is the one the sizing is measured against,
      # and it fires before the job's own.
      #
      # That maximum is the product of three factors. Two the mutants
      # configuration states: the module set it enumerates, which decides how
      # many mutants are seeded, and the per-mutant test list, which decides
      # what each seeded mutant costs. Widening either — a module joining
      # examine_globs, or a binary joining additional_cargo_test_args — is the
      # moment to re-check this number. The third is the cache above: it stores
      # the registry only, and this job's weekly cadence sits at the platform's
      # inactivity-eviction window, so what this bound has to cover is the cold
      # run — a registry refetch and the whole baseline build ahead of the first
      # mutant — not the warm one alone.
      - name: Run cargo-mutants (scoped)
        working-directory: packages/desktop/src-tauri
        timeout-minutes: 150
        shell: bash
        run: |
          set +e
          cargo mutants --in-place
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      # The save half of the split above, after the step that populates the
      # registry it stores. Its gate and its reasoning are the
      # desktop-rust-tests cargo block's in test.yml.
      - name: Save cargo registry
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mutation-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}

      - name: Report outcomes to the run summary
        if: always()
        working-directory: packages/desktop/src-tauri
        shell: bash
        run: |
          {
            echo "## cargo-mutants (desktop capture logic modules)"
            for f in caught missed timeout unviable; do
              n=$(wc -l < "mutants.out/$f.txt" 2>/dev/null || echo 0)
              echo "- $f: $n"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cargo-mutants output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-desktop-rust
          path: packages/desktop/src-tauri/mutants.out/
          retention-days: 30
