<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src http: https: ws://127.0.0.1:*;"
    />
    <title>Docent</title>
    <link rel="stylesheet" href="../shared/views/panel.css" />
  </head>
  <body>
    <!-- ── Header ─────────────────────────────────────────────────── -->
    <header>
      <div class="header-right">
        <div id="recording-badge" class="badge badge--idle">Idle</div>
        <button
          id="btn-control-channel"
          class="btn btn--icon"
          title="Local control"
          aria-label="Local control"
          aria-expanded="false"
          aria-controls="control-channel-setup"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M7 6 3 10l4 4M13 6l4 4-4 4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="btn-settings" class="btn btn--icon" title="Settings" aria-label="Settings">
          <svg
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M8.25 2a.75.75 0 0 0-.74.63l-.22 1.48a5.5 5.5 0 0 0-.93.54l-1.4-.56a.75.75 0 0 0-.9.34L2.76 6.57a.75.75 0 0 0 .17.96l1.18.93a5.6 5.6 0 0 0 0 1.08l-1.18.93a.75.75 0 0 0-.17.96l1.2 2.08a.75.75 0 0 0 .9.34l1.4-.56c.29.2.6.38.93.54l.22 1.48a.75.75 0 0 0 .74.63h2.5a.75.75 0 0 0 .74-.63l.22-1.48c.33-.16.64-.33.93-.54l1.4.56a.75.75 0 0 0 .9-.34l1.2-2.08a.75.75 0 0 0-.17-.96l-1.18-.93a5.6 5.6 0 0 0 0-1.08l1.18-.93a.75.75 0 0 0 .17-.96l-1.2-2.08a.75.75 0 0 0-.9-.34l-1.4.56a5.5 5.5 0 0 0-.93-.54l-.22-1.48A.75.75 0 0 0 10.75 2h-2.5zm1.25 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Breadcrumb ──────────────────────────────────────────────── -->
    <nav id="breadcrumb" class="breadcrumb hidden">
      <button id="bc-projects" class="bc-item bc-link">Projects</button>
      <span id="bc-sep-1" class="bc-sep hidden">
        <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            d="M4 2l4 4-4 4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <button id="bc-project" class="bc-item bc-link hidden"></button>
      <span id="bc-sep-2" class="bc-sep hidden">
        <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            d="M4 2l4 4-4 4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span id="bc-recording" class="bc-item hidden"></span>
    </nav>

    <!-- Storage-quota warning (#127). View-independent (outside the injected
         views) so it shows whenever chrome.storage.local nears its quota —
         recording or not. -->
    <div
      id="storage-quota-banner"
      class="storage-quota-banner hidden"
      role="status"
      aria-live="polite"
    >
      <span id="storage-quota-banner-text"></span>
      <button id="btn-storage-quota-resume" class="btn btn--ghost btn--sm hidden">
        Keep recording
      </button>
    </div>

    <!-- Local control channel. View-independent (outside the injected views)
         and extension-only: the indicator shows on every view for as long as
         the channel is on, and the setup group opens from the header button. -->
    <div
      id="control-channel-indicator"
      class="storage-quota-banner hidden"
      role="status"
      aria-live="polite"
    >
      <span>
        <span id="control-channel-indicator-text"></span>
        <code id="control-channel-code" class="hidden"></code>
        <span id="control-channel-export" class="hidden"></span>
      </span>
      <button id="btn-control-channel-off" class="btn btn--ghost btn--sm">Turn off</button>
    </div>
    <section id="control-channel-setup" class="settings-group hidden" aria-label="Local control">
      <span class="settings-label">Local control</span>
      <p class="settings-hint">
        Lets a program on this computer create a project and a recording, pause and resume capture,
        and commit steps, and, if you allow it below, export the project open here. It is off until
        you turn it on, and it turns off when this panel closes.
      </p>
      <label class="settings-label mt-12" for="control-channel-port">Port on this computer</label>
      <input
        id="control-channel-port"
        type="text"
        inputmode="numeric"
        value="8765"
        aria-describedby="control-channel-error"
      />
      <p id="control-channel-error" class="settings-field-error hidden"></p>
      <label class="toggle-row mt-12">
        <input type="checkbox" id="control-channel-allow-export" autocomplete="off" />
        <span class="toggle-label"
          >Let the local program export the project open here, with its full step history</span
        >
      </label>
      <div class="form-actions">
        <button id="btn-control-channel-on" class="btn btn--primary btn--sm">Turn on</button>
      </div>
      <p id="control-channel-notice" class="settings-hint hidden" role="status"></p>
    </section>

    <!-- SHARED_VIEWS -->

    <script type="module" src="panel.js"></script>
  </body>
</html>
