# cargo-mutants configuration — scoped mutation testing for the desktop capture
# backend.
#
# The examine_globs below are the mutate scope, and they are a curated
# enumeration: a module is mutated because this list names it. The
# test-strategy doc (docs/test/strategy/mutation.md) states the same set as a
# table, and the test-inventory lint (npm run lint:test-inventory) holds the two
# to each other in both directions, so widening or narrowing the scope is one
# edit to both surfaces.
#
# The live-input capture path in the rest of the backend is deliberately
# unmutated: its only exercising tests synthesize real OS input and are excluded
# from the per-mutant test runs, so its mutants would survive en masse and tell
# us nothing. That path is guarded by the input-synthesis integration suites and
# the scripted-truth corpus instead — an accepted, documented gap of this tool,
# not an oversight.
examine_globs = [
  "src/capture/action_mapping.rs",
  "src/capture/element_mapping.rs",
  "src/capture/coordinate.rs",
  "src/capture/scroll.rs",
  "src/capture/timing.rs",
]

# Pin which tests RUN per mutant: --lib keeps the in-module #[cfg(test)] unit
# tests in the kill set, and the --test entries below name the test binaries
# that run against every mutant. Which binaries belong is decided by the
# membership criterion the test-strategy doc states
# (docs/test/strategy/mutation.md §MUT-7), and the test-inventory lint
# (npm run lint:test-inventory) derives that set from this crate and holds this
# list to it in both directions, so a binary joining or leaving is one edit
# here. Note this pins only the test RUN — the per-mutant build still compiles
# all workspace test targets.
additional_cargo_test_args = [
  "--lib",
  "--test", "action_mapping_test",
  "--test", "capture_mode_test",
  "--test", "coordinate_dpi_test",
  "--test", "coordinate_test",
  "--test", "element_mapping_test",
  "--test", "password_test",
  "--test", "pid_filter_test",
  "--test", "scroll_test",
  "--test", "windows_capture_test",
  "--test", "worker_pool_test",
]
