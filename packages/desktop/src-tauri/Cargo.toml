[package]
name = "docent-desktop"
version = "2.0.0"
edition = "2021"
description = "Docent Desktop — captures demonstrated workflows as structured data, not code"
license = "GPL-3.0-or-later"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Native HTTP transport: the desktop issues sync/dispatch/connection-test
# requests from Rust to bypass the webview's CORS. rustls-tls (no native-tls /
# OpenSSL) keeps this cross-platform for the future Linux target (#84).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# Secret-at-rest: API keys are stored in the Windows Credential Manager
# rather than in plaintext inside session.json. keyring v3.x is the stable
# application-facing library API (v4 became a CLI/sample crate — the library
# moved to keyring-core; see the crate README). Gated to Windows because that
# is the only shipping target with a capture backend; other targets fall back
# to the previous inline behaviour.
keyring = { version = "3", features = ["windows-native"] }
# The crate's only windows-rs dependency: the runtime of the generated Win32
# bindings (`src/capture/win32_bindings.rs`, the output of windows-bindgen over
# `tools/bindgen/filter.txt`) and of the hand-written modules beside them
# (`uia_core_api.rs`, `variant.rs`), which together declare every Win32 and UI
# Automation name the capture backend and the Windows test binaries use — COM
# interface plumbing, BSTR, HRESULT, the `implement` macro the corpus fixture's
# providers use. Pinned exactly; the generator's `--check` holds this pin and the
# generator's windows-bindgen pin on one 0.<minor> version line.
windows-core = "=0.100.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
proptest = "1"
enigo = "0.6"
serial_test = "4"
tempfile = "3"

[lib]
name = "docent_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
